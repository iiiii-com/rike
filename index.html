<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日课">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>日课 · 日日不断，功不唐捐</title>
<style>
/* SECTION: tokens */
:root{
  --bg:#FAFAF7; --card:#FFFFFF; --card2:#F4F3EE; --line:#E7E4DC;
  --text:#1A1A1A; --sub:#666666; --dim:#9A958B;
  --pri:#3FA66A; --pri-soft:#E8F3EC; --pri-deep:#2E7F50;
  --warn:#C1694E; --amber:#B08A3E;
  --radius:16px; --shadow:0 1px 2px rgba(26,26,26,.04),0 6px 18px rgba(26,26,26,.05);
  --hm0:#EFEDE6; --hm1:#D6EADB; --hm2:#A8D6B8; --hm3:#6EBE8C; --hm4:#2E8B57;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  --num:"SF Mono",ui-monospace,Consolas,Menlo,monospace;
}
html.dark{
  --bg:#16181A; --card:#1E2124; --card2:#252A2E; --line:#313740;
  --text:#ECEAE5; --sub:#A9ADB3; --dim:#7A8089;
  --pri:#54BE80; --pri-soft:#1F3329; --pri-deep:#7FD3A0;
  --warn:#D8836A; --amber:#C9A25C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.28);
  --hm0:#24282C; --hm1:#22402D; --hm2:#2C5F3E; --hm3:#3E8C5B; --hm4:#5CC286;
}
/* SECTION: skins（积分解锁 / Pro） */
html[data-skin="sunset"]{--pri:#D07A45;--pri-soft:#F7EBE3;--pri-deep:#A85B2E;--hm1:#F1DCCB;--hm2:#E2B48F;--hm3:#D07A45;--hm4:#A85B2E}
html[data-skin="sunset"].dark{--pri:#E0946A;--pri-soft:#33241C;--pri-deep:#EFB58F;--hm1:#3A2A20;--hm2:#5C3D29;--hm3:#8A5A38;--hm4:#E0946A}
html[data-skin="indigo"]{--pri:#5B6ABF;--pri-soft:#EAECF8;--pri-deep:#43508F;--hm1:#D8DCEF;--hm2:#A9B2DC;--hm3:#7A87C8;--hm4:#43508F}
html[data-skin="indigo"].dark{--pri:#8A96D8;--pri-soft:#232638;--pri-deep:#B0B9E8;--hm1:#2A2E47;--hm2:#3E4570;--hm3:#5B68A8;--hm4:#8A96D8}
html[data-skin="sakura"]{--pri:#C75B8A;--pri-soft:#FAEAF0;--pri-deep:#9E4068;--hm1:#F2D7E2;--hm2:#E3A8C0;--hm3:#D1789F;--hm4:#9E4068}
html[data-skin="sakura"].dark{--pri:#DB84A8;--pri-soft:#36232B;--pri-deep:#EEA9C5;--hm1:#422731;--hm2:#663A4B;--hm3:#9C5473;--hm4:#DB84A8}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased;transition:background .25s ease}
body.no-scroll{overflow:hidden}
h1,h2,h3{margin:0;line-height:1.3;font-weight:650}
h1{font-size:26px;letter-spacing:-.2px}
h3{font-size:16px}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit;font-size:15px}
.dim{color:var(--dim)}

/* SECTION: shell */
.shell{display:flex;min-height:100vh}
#sidebar{width:212px;flex:0 0 212px;padding:22px 14px 18px;display:flex;flex-direction:column;gap:4px;
  border-right:1px solid var(--line);background:var(--card);position:sticky;top:0;height:100vh}
.brand{font-size:15px;font-weight:700;padding:6px 12px 18px;display:flex;align-items:center;gap:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:var(--sub);font-size:15px;width:100%;text-align:left;transition:background .18s,color .18s}
.nav-item .ni{font-size:17px;width:20px;text-align:center}
.nav-item:hover{background:var(--card2);color:var(--text)}
.nav-item.on{background:var(--pri-soft);color:var(--pri-deep);font-weight:650}
.side-foot{margin-top:auto;padding-top:14px}
.ghost-btn{width:100%;padding:10px;border:1px dashed var(--line);border-radius:11px;color:var(--sub);font-size:14px;transition:border-color .2s,color .2s}
.ghost-btn:hover{border-color:var(--pri);color:var(--pri)}
#main{flex:1;min-width:0;padding-bottom:96px}
.page{max-width:780px;margin:0 auto;padding:26px 22px 40px}
#bottom-nav{display:none}

/* SECTION: buttons */
.btn{padding:10px 18px;border-radius:12px;font-size:15px;font-weight:600;transition:transform .15s ease,filter .15s ease,background .2s;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--pri);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.primary[disabled]{background:var(--line);color:var(--dim);cursor:not-allowed}
.btn.soft{background:var(--pri-soft);color:var(--pri-deep)}
.btn.ghost{border-color:var(--line);color:var(--sub)}
.btn.danger{background:var(--warn);color:#fff}
.btn.danger-ghost{border-color:var(--warn);color:var(--warn)}
.btn.wide{width:100%}
.btn.big{padding:14px 30px;font-size:16px;border-radius:14px}
.link-btn{color:var(--sub);font-size:13.5px;padding:4px 2px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.link-btn:hover{color:var(--pri)}
.link-btn.danger:hover{color:var(--warn)}
.x{font-size:22px;line-height:1;color:var(--dim);padding:2px 8px;border-radius:8px}
.x:hover{color:var(--text)}

/* SECTION: today */
.today-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.date-line{color:var(--sub);font-size:14px;margin-top:4px}
.add-fab{width:46px;height:46px;border-radius:50%;background:var(--pri);color:#fff;font-size:24px;line-height:1;box-shadow:var(--shadow);flex:0 0 46px;transition:transform .18s ease}
.add-fab:hover{transform:rotate(90deg) scale(1.05)}
.notif-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;font-size:14px;color:var(--sub);margin-bottom:12px}
.streak-card{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.flame{font-size:30px;display:flex;align-items:baseline;gap:2px}
.flame span{font-family:var(--num);font-size:40px;font-weight:700;color:var(--pri);letter-spacing:-1px}
.flame em{font-style:normal;font-size:14px;color:var(--dim);margin-left:2px}
.streak-txt strong{font-size:16px}
.streak-txt p{font-size:13.5px;color:var(--sub);margin-top:2px}
.hint-em{color:var(--amber)!important;font-weight:600}
.makeup-card{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--pri-soft);
  border-radius:var(--radius);padding:14px 18px;margin-bottom:14px}
.makeup-card p{font-size:13px;color:var(--sub);margin-top:2px}
.task-list{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.task-row{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 15px;transition:border-color .25s,opacity .25s,background .25s}
.task-row.done{opacity:.62;background:var(--card2)}
.tr-body{flex:1;min-width:0}
.tr-name{display:block;font-size:15.5px;font-weight:600}
.task-row.done .tr-name{text-decoration:line-through;text-decoration-color:var(--dim)}
.tr-meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:2px}
.tr-meta i{font-style:normal;font-size:12.5px;color:var(--dim)}
.tr-done-tag{font-size:12px;color:var(--pri);font-weight:600;white-space:nowrap}
.check{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:2px solid var(--line);background:var(--card);
  font-size:20px;color:#fff;display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s}
.check:hover{border-color:var(--pri)}
.check.on{background:var(--pri);border-color:var(--pri);animation:pop .4s ease}
@keyframes pop{0%{transform:scale(.7)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.page{animation:fadeUp .28s ease}
.today-foot{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--sub);margin:4px 0 12px}
.mini-bar{flex:1;height:6px;border-radius:99px;background:var(--card2);overflow:hidden}
.mini-bar i{display:block;height:100%;border-radius:99px;background:var(--pri);transition:width .45s cubic-bezier(.22,1,.36,1)}
.no-due{color:var(--dim);font-size:14px;padding:6px 0 14px}
.add-line{margin-top:6px;color:var(--sub);border:1px dashed var(--line)}
.empty{text-align:center;padding:44px 20px;color:var(--sub)}
.empty-ic{font-size:38px;margin-bottom:10px}
.empty p{margin-bottom:16px;font-size:14.5px}

/* SECTION: tasks */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.head-ops{display:flex;gap:8px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chips.wrap{flex:1}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);font-size:13.5px;color:var(--sub);background:var(--card);transition:all .18s}
.chip:hover{border-color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.chip.sm{padding:5px 10px;font-size:12.5px}
.task-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 17px}
.tcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tcard-top strong{font-size:15.5px}
.tag{font-size:12px;font-weight:600;white-space:nowrap}
.tcard-meta{font-size:12.5px;color:var(--dim);margin-top:4px}
.tcard-stat{font-size:13px;color:var(--sub);margin-top:6px;font-family:var(--num)}
.tcard-ops{display:flex;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap}

/* SECTION: stats */
.stat-line{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.sitem{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center}
.sitem strong{display:block;font-size:24px;font-family:var(--num);color:var(--pri);letter-spacing:-.5px}
.sitem span{font-size:12.5px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-q{font-size:13px;color:var(--dim);margin:3px 0 14px}
.hm-wrap{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.hm-col{display:flex;flex-direction:column;gap:4px}
.hm-cell{width:14px;height:14px;border-radius:3px;background:var(--hm0);flex:0 0 14px;display:inline-block}
.hm-cell.lv-1{opacity:.35}
.hm-cell.lv1{background:var(--hm1)}.hm-cell.lv2{background:var(--hm2)}
.hm-cell.lv3{background:var(--hm3)}.hm-cell.lv4{background:var(--hm4)}
.hm-legend{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);margin-top:10px;flex-wrap:wrap}
.hm-legend .hm-cell{width:11px;height:11px;flex:0 0 11px}
.hm-note{margin-left:auto}
.trend{width:100%;height:150px;display:block}
.trend-area{fill:var(--pri-soft)}
.trend-line{fill:none;stroke:var(--pri);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.trend-dot{fill:var(--card);stroke:var(--pri);stroke-width:2}
.trend-x{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
.cbar{display:grid;grid-template-columns:78px 1fr 44px;align-items:center;gap:10px;margin-bottom:9px;font-size:13.5px}
.cbar-track{height:9px;background:var(--card2);border-radius:99px;overflow:hidden}
.cbar-track i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.cbar-v{text-align:right;font-family:var(--num);color:var(--sub);font-size:13px}
.time-buckets{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;height:110px;align-items:end}
.tb{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.tb i{width:60%;max-width:52px;min-height:3px;border-radius:8px 8px 3px 3px;background:var(--pri);opacity:.85}
.tb span{font-size:12.5px;color:var(--sub)}
.tb em{font-style:normal;font-size:12px;color:var(--dim);font-family:var(--num)}
.ms-list{position:relative;padding-left:6px}
.ms-list li{display:flex;gap:12px;padding:7px 0;position:relative}
.ms-list li:not(:last-child):before{content:"";position:absolute;left:5px;top:22px;bottom:-4px;width:1px;background:var(--line)}
.ms-dot{width:11px;height:11px;border-radius:50%;background:var(--pri);flex:0 0 11px;margin-top:6px;box-shadow:0 0 0 3px var(--pri-soft)}
.ms-list strong{font-size:14.5px;display:block}
.ms-list span{font-size:12.5px;color:var(--dim);font-family:var(--num)}

/* SECTION: badges */
.lv-card .lv-top{display:flex;align-items:center;gap:14px}
.lv-badge{width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:700;font-size:15px}
.lv-top strong{font-size:16px}
.lv-top p{font-size:13px;color:var(--sub);margin-top:1px}
.lv-bar{height:8px;background:var(--card2);border-radius:99px;margin-top:14px;overflow:hidden}
.lv-bar i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.badge{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px 10px;text-align:center;transition:transform .2s,box-shadow .2s}
.badge.on{background:var(--card);box-shadow:var(--shadow)}
.badge.on:hover{transform:translateY(-3px)}
.badge .b-ic{font-size:26px;display:block;margin-bottom:6px;filter:grayscale(1);opacity:.45}
.badge.on .b-ic{filter:none;opacity:1}
.badge strong{font-size:13.5px;display:block}
.badge p{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.4}
.rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px 16px;font-size:13.5px;color:var(--sub)}
.rules li:before{content:"+";color:var(--pri);font-weight:700;margin-right:7px;font-family:var(--num)}

/* SECTION: settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.set-row:last-of-type{border-bottom:0}
.set-row p{font-size:12.5px;color:var(--dim);margin-top:1px;max-width:420px}
.switch{width:46px;height:27px;flex:0 0 46px;border-radius:99px;background:var(--line);position:relative;transition:background .22s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.22,1,.36,1);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--pri)}
.switch.on:after{transform:translateX(19px)}
.set-ops{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.about p{font-size:14px;margin-top:4px}

/* SECTION: modal */
#modal-root[hidden]{display:none}
.modal-mask{position:fixed;inset:0;background:rgba(20,20,20,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60;animation:fadeUp .2s ease}
.modal{background:var(--card);border-radius:20px;padding:22px;width:min(520px,100%);max-height:88vh;overflow-y:auto;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h2{font-size:19px}
.form{display:flex;flex-direction:column;gap:14px}
.form label{font-size:13.5px;color:var(--sub);display:flex;flex-direction:column;gap:6px;font-weight:600}
.form input{padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text);outline:none;transition:border-color .2s}
.form input:focus{border-color:var(--pri)}
.frow{display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--sub);font-weight:600}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-ops{display:flex;justify-content:flex-end;gap:9px;margin-top:4px}
.form-hint{font-size:12.5px;color:var(--dim);line-height:1.5}
.confirm-txt{font-size:14.5px;color:var(--sub);margin-bottom:18px}
.tpl-intro{font-size:14px;color:var(--sub);margin-bottom:14px}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .2s,transform .2s}
.tpl:hover{border-color:var(--pri);transform:translateY(-2px)}
.tpl .tpl-ic{font-size:19px;margin-bottom:3px}
.tpl strong{font-size:14px}
.tpl-meta{font-size:12px;color:var(--dim)}

/* SECTION: onboarding */
body.ob-mode #main{padding-bottom:0}
#ob-root[hidden]{display:none}
#ob-root{position:fixed;inset:0;background:var(--bg);z-index:80;overflow-y:auto}
#ob-root>div{max-width:460px;margin:0 auto;padding:44px 26px 60px;animation:fadeUp .3s ease}
.ob-hero{text-align:center;padding-top:8vh!important}
.ob-logo{font-size:52px;margin-bottom:14px}
.ob-hero h1,.ob-sub{margin-bottom:10px}
#ob-root h1{font-size:24px;margin-bottom:8px}
#ob-root p{color:var(--sub);font-size:14.5px}
.ob-sub{margin-bottom:20px!important}
.ob-ops{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.ob-doms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ob-dom{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 8px;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px;transition:border-color .2s,background .2s}
.ob-dom span{font-size:24px}
.ob-dom.on{border-color:var(--pri);background:var(--pri-soft);font-weight:650}
.ob-tpls{display:flex;flex-direction:column;gap:8px}
.ob-tpl{background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:border-color .2s}
.ob-tpl.on{border-color:var(--pri);background:var(--pri-soft)}
.ob-tpl strong{font-size:14.5px}
.ob-tpl span{font-size:12.5px;color:var(--dim)}
.ob-custom{margin-top:12px}
.ob-custom input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);outline:none}
.ob-custom input:focus{border-color:var(--pri)}
.ob-check-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:18px 0 10px;text-align:left;font-size:16px;font-weight:600}
.big-check{width:52px;height:52px;flex:0 0 52px;font-size:24px}

/* SECTION: v2 components */
.side-pro{font-size:11.5px;color:var(--dim);padding:10px 12px 0;line-height:1.5}
.side-pro.on{color:var(--pri);font-weight:650}
.streak-txt em{font-style:normal;color:var(--pri-deep);font-weight:600}
.tr-why{display:block;font-size:12.5px;color:var(--dim);font-style:italic;margin-top:2px}
.tcard-why{font-size:12.5px;color:var(--pri-deep);font-style:italic;margin-top:4px}
.stepper{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.stepper button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:17px;color:var(--sub);line-height:1;transition:border-color .2s}
.stepper button:hover{border-color:var(--pri);color:var(--pri)}
.stepper em{font-style:normal;font-family:var(--num);font-size:12.5px;color:var(--sub);min-width:64px;text-align:center}
.nl-bar{display:flex;gap:8px;margin-top:6px}
.nl-bar input{flex:1;min-width:0;padding:12px 14px;border:1.5px dashed var(--line);border-radius:13px;background:var(--card);color:var(--text);outline:none;font-size:14px}
.nl-bar input:focus{border-color:var(--pri);border-style:solid}
.fatigue-card{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--amber);border-radius:var(--radius);padding:14px 18px;margin-bottom:14px}
.fatigue-card p{font-size:13.5px;color:var(--sub);margin-top:3px}
.fat-ops{display:flex;gap:12px;align-items:center}
.wr-rate{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.wr-rate strong{font-size:38px;font-family:var(--num);color:var(--pri);letter-spacing:-1px}
.wr-rate span{font-size:13.5px;color:var(--sub)}
.wr-list{margin-bottom:12px}
.wr-list li{font-size:14.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.wr-list li:last-child{border-bottom:0}
.wr-q{background:var(--pri-soft);border-radius:13px;padding:13px 16px;margin-bottom:14px}
.wr-q strong{font-size:13px;color:var(--pri-deep)}
.wr-q p{font-size:15px;margin-top:4px}
.sel{padding:9px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--text);font-size:14px}
.sw{width:26px;height:26px;border-radius:8px;display:inline-block;flex:0 0 26px}
.sw-sm{width:14px;height:14px;border-radius:5px;flex-basis:14px;display:inline-block;vertical-align:-2px;margin-right:2px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.shop-item{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:13px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.shop-item.own{background:var(--card)}
.shop-item strong{font-size:13.5px}
.partner-list{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.prow{display:flex;align-items:center;gap:11px;background:var(--card2);border-radius:13px;padding:11px 13px}
.pav{font-size:24px;flex:0 0 30px;text-align:center}
.pinfo{flex:1;min-width:0}
.pinfo p{font-size:12px;color:var(--dim)}
.pchip{font-size:11.5px;color:var(--pri);background:var(--pri-soft);padding:3px 9px;border-radius:99px;white-space:nowrap;font-weight:600}
.chat{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;margin-bottom:12px;padding:4px}
.msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:14px;line-height:1.5}
.msg.them{background:var(--card2);border-bottom-left-radius:4px;align-self:flex-start}
.msg.me{background:var(--pri);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.chat-input{display:flex;gap:8px}
.chat-input input{flex:1;min-width:0;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);outline:none}
.chat-input input:focus{border-color:var(--pri)}
.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.plan{position:relative;background:var(--card2);border:1.5px solid var(--line);border-radius:15px;padding:16px 12px;display:flex;flex-direction:column;gap:4px;align-items:center;transition:border-color .2s}
.plan:hover{border-color:var(--pri)}
.plan.best{border-color:var(--pri);background:var(--pri-soft)}
.plan strong{font-size:15px}
.plan-price{font-family:var(--num);font-size:15px;color:var(--pri-deep);font-weight:700}
.save-tag{position:absolute;top:-9px;right:10px;background:var(--amber);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:600}
.pay-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.pay{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:11px;padding:9px 13px;font-size:13.5px;cursor:pointer;color:var(--sub)}
.pay input{accent-color:var(--pri)}
.pay:has(input:checked){border-color:var(--pri);color:var(--text);font-weight:600;background:var(--pri-soft)}
.cmp-row{display:grid;grid-template-columns:44px 1fr 48px;align-items:center;gap:10px;margin-bottom:9px;font-size:13.5px;color:var(--sub)}
.cmp-track{height:14px;background:var(--card2);border-radius:99px;overflow:hidden}
.cmp-track i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.cmp-row em{font-style:normal;font-family:var(--num);text-align:right;color:var(--text);font-weight:600}
.cmp-v{font-size:13.5px;color:var(--sub);margin-top:4px}
.cmp-v strong{color:var(--pri)}
.cmp-none{font-size:13px;color:var(--dim);margin-bottom:8px}
.goal-row{display:flex;gap:8px}
.goal-row input{flex:1;min-width:0}
.goal-row select{width:92px;padding:11px 8px;border:1px solid var(--line);border-radius:11px;background:var(--bg);color:var(--text)}
.nl-prev{display:flex;flex-direction:column;gap:12px}
.nl-prev strong{font-size:18px}
.rep-hero{background:linear-gradient(135deg,var(--pri-soft),var(--card));border-color:var(--pri)}
.rep-line{font-size:16px;line-height:1.9}
.rep-line strong{color:var(--pri);font-family:var(--num);font-size:20px}
.rep-line.quote{font-style:italic;color:var(--sub)}
.rep-bars{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:120px;align-items:end}
.rb{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.rb i{width:70%;min-height:2px;border-radius:5px 5px 2px 2px;background:var(--pri);opacity:.85}
.rb span{font-size:10.5px;color:var(--dim)}
.share-box{display:flex;justify-content:center;margin-bottom:14px}
#share-cv{max-width:240px;height:auto;border-radius:14px;box-shadow:var(--shadow)}
.imp-area{width:100%;min-height:120px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);font-family:var(--num);font-size:12.5px;resize:vertical;outline:none}
.imp-area:focus{border-color:var(--pri)}

/* SECTION: toast */
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);background:var(--text);color:var(--bg);
  padding:11px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:99;max-width:86vw;box-shadow:0 8px 24px rgba(0,0,0,.24)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* SECTION: responsive */
@media (max-width:1023px){
  #sidebar{width:176px;flex-basis:176px}
}
@media (max-width:767px){
  h1{font-size:21px}
  .shell{display:block}
  #sidebar{display:none}
  #main{padding-bottom:76px}
  .page{padding:18px 16px 32px}
  #bottom-nav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim);padding:6px 2px;border-radius:10px}
  .bn-item .ni{font-size:20px}
  .bn-item.on{color:var(--pri);font-weight:650}
  .add-fab{position:fixed;right:18px;bottom:76px;z-index:45;width:52px;height:52px;font-size:26px}
  .stat-line{grid-template-columns:repeat(2,1fr)}
  .task-cards{grid-template-columns:1fr}
  .tpl-grid{grid-template-columns:1fr}
  .streak-card{padding:15px 16px;gap:14px}
  .flame span{font-size:34px}
  .time-buckets{gap:8px}
  .frow2{grid-template-columns:1fr}
  .hm-cell{width:12px;height:12px;flex-basis:12px}
  .modal{padding:18px;border-radius:18px}
  #toast{bottom:88px}
  .ob-ops{justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
/* SECTION: responsive-v2 */
@media (max-width:767px){
  .nl-bar{flex-direction:column}
  .nl-bar .btn{width:100%}
  .stepper em{min-width:56px}
  .task-row .stepper button{width:44px;height:44px;border-radius:12px;font-size:20px}
  .prow{flex-wrap:wrap}
  .pchip{order:3}
  .plan-grid{grid-template-columns:1fr}
  .rep-bars{gap:3px;height:96px}
  .rb span{font-size:9px}
  .shop-grid{grid-template-columns:repeat(2,1fr)}
}
/* SECTION: print（年度报告） */
@media print{
  #sidebar,#bottom-nav,.add-fab,.head-ops,.notif-strip,#toast,#modal-root,#ob-root{display:none!important}
  body{background:#fff}
  .page{padding:0;max-width:100%}
  .card{box-shadow:none;break-inside:avoid;border:1px solid #ddd}
}
/* SECTION: v3-mobile（触控目标/离线角标） */
@media (max-width:767px){
  .task-row .check{width:56px;height:56px;flex-basis:56px;font-size:26px}
  #offline-dot{display:none;position:fixed;top:10px;right:12px;z-index:70;font-size:11px;
    background:var(--card);color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:5px 11px;box-shadow:var(--shadow)}
  body.is-offline #offline-dot{display:block}
  .bn-item{min-height:50px}
}
@media (min-width:768px){ #offline-dot{display:none!important} }
/* SECTION: v3-challenge */
.chal-card{background:var(--card);border:1px dashed var(--amber);border-radius:var(--radius);padding:13px 16px;margin:0 0 12px}
.chal-card p{font-size:14px;color:var(--sub);margin:5px 0 9px}
.chal-card.done{opacity:.65;border-style:solid}
.chal-ok{font-size:13px;color:var(--pri-deep);font-weight:650}
kbd{font-family:var(--num);font-size:11px;background:var(--card2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--sub)}

/* SECTION: v4-brand —— 日课设计系统：衬线字标 / 氛围 / 转场 / 涟漪 / 任务档案 */
:root{
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif;
  --paper:rgba(63,166,106,.045);
  --ease:cubic-bezier(.22,1,.36,1);
}
/* 氛围：极淡的光晕浮在纸上 */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(46vw 46vw at 82% -12%, var(--paper), transparent 62%),
    radial-gradient(38vw 38vw at -10% 100%, var(--paper), transparent 58%);
  animation:auraDrift 46s ease-in-out infinite alternate}
@keyframes auraDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(2.5%,2%,0) scale(1.04)}}
.shell,#bottom-nav,#modal-root,#ob-root,#fx-root,#toast,#offline-dot{position:relative;z-index:1}
/* 字标与标题：宋体衬线 */
.brand{font-family:var(--serif);letter-spacing:.18em;font-weight:600}
.brand .brand-dot{color:var(--pri)}
h1,.flame span,.wr-rate strong,.lv-badge,.streak-title{font-family:var(--serif)}
.brand-latin{font-size:9.5px;letter-spacing:.32em;color:var(--dim);text-transform:uppercase;padding:0 12px 12px}
.page-title-row{display:flex;align-items:baseline;gap:14px;margin-bottom:20px}
.page-title-row h1{font-weight:600;letter-spacing:.06em}
.page-title-row .title-latin{font-size:10px;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.page-title-row::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
/* 数字统一等宽 */
.flame span{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
/* 入场：层叠上浮 */
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.stagger>*{animation:riseIn .5s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.14s}
.stagger>*:nth-child(5){animation-delay:.18s}.stagger>*:nth-child(6){animation-delay:.22s}
.stagger>*:nth-child(7){animation-delay:.26s}.stagger>*:nth-child(8){animation-delay:.3s}
.stagger>*:nth-child(n+9){animation-delay:.34s}
/* 弹层：由下浮现 + 遮罩淡入 */
.modal-mask{animation:maskIn .24s ease both}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
.modal-mask .modal{animation:modalIn .34s var(--ease) both}
@keyframes modalIn{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
/* 点击涟漪 */
.ripple{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.14;transform:scale(0);pointer-events:none;animation:rip .5s ease-out forwards}
@keyframes rip{to{transform:scale(2.6);opacity:0}}
/* 主按钮微光流动 */
.btn.primary{position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);transition:left .55s var(--ease)}
.btn.primary:hover::after{left:120%}
/* 卡片 hover 抬起 */
.card,.tcard,.badge.on{transition:transform .3s var(--ease),box-shadow .3s ease}
@media (hover:hover){.card:hover,.tcard:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(26,26,26,.07)}}
html.dark .card:hover,html.dark .tcard:hover{box-shadow:0 10px 30px rgba(0,0,0,.4)}
/* 导航指示线 */
.nav-item{position:relative}
.nav-item.on::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:2px;background:var(--pri)}
/* 火焰微燃 */
.flame{position:relative}
.flame:before{content:"";position:absolute;left:2px;top:6px;width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle,rgba(228,120,60,.4),transparent 70%);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.35);opacity:.35}}
/* 连续天数跳动 */
@keyframes bumpNum{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
.flame.bump span{display:inline-block;animation:bumpNum .45s var(--ease)}
/* 任务行完成：整行泛起光扫 */
.task-row{position:relative;overflow:hidden}
.task-row .sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(100deg,transparent 30%,var(--paper) 50%,transparent 70%);
  transform:translateX(-100%)}
.task-row.justdone .sheen{animation:sheen .7s var(--ease)}
@keyframes sheen{to{transform:translateX(100%)}}
/* —— 任务档案（dossier）—— */
.dossier-list{display:flex;flex-direction:column;gap:10px}
.dossier-item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;transition:border-color .2s,transform .2s var(--ease)}
.dossier-item:hover{border-color:var(--pri)}
.dossier-item:active{transform:scale(.995)}
.di-name{flex:1;min-width:0}
.di-name strong{display:block;font-size:15px}
.di-name span{font-size:12px;color:var(--dim)}
.di-spark{display:flex;gap:2px;flex-wrap:wrap;width:120px}
.di-spark i{width:5px;height:11px;border-radius:1px;background:var(--card2)}
.di-spark i.hit{background:var(--pri)}
.di-rate{font-family:var(--num);font-size:13.5px;color:var(--sub);min-width:44px;text-align:right}
.di-arrow{color:var(--dim)}
/* 任务详情弹层 */
.dos-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dos-why{font-family:var(--serif);font-size:15px;font-style:italic;color:var(--pri-deep);background:var(--pri-soft);border-radius:12px;padding:10px 14px;margin:10px 0 14px}
.dos-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.dos-nums .sitem strong{font-size:19px}
.dos-months{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px;margin-bottom:6px}
.dos-m{background:var(--card2);border-radius:9px;padding:7px 9px;text-align:center}
.dos-m em{font-style:normal;display:block;font-size:10.5px;color:var(--dim)}
.dos-m strong{font-family:var(--num);font-size:13px;color:var(--pri-deep)}
.dos-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.dos-weekdays{display:flex;gap:5px;margin:2px 0 14px}
.dos-weekdays i{width:22px;height:22px;border-radius:7px;background:var(--card2);font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.dos-weekdays i.hit{background:var(--pri);color:#fff;font-weight:700}
.dos-chart{margin-bottom:12px}
.dos-future{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.dos-future .ft-row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--sub)}
.dos-future .ft-row em{font-style:normal;font-family:var(--num);min-width:34px;color:var(--text)}
.dos-ops{display:flex;gap:8px;flex-wrap:wrap}
.dos-note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.6}
@media (max-width:767px){.dos-nums{grid-template-columns:repeat(2,1fr)}.di-spark{display:none}}
/* v4 补充：色点 / 难度 / 档案图表 / 更多按钮 */
.tr-meta .dot,.cbar .dot,.di-name+.dot{display:inline-block}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:1px}
.tr-meta .dot{margin-right:1px}
.diff{display:inline-flex;gap:2.5px;align-items:center;margin-left:2px}
.diff b{width:5px;height:5px;border-radius:50%;background:var(--line)}
.diff b.f{background:var(--amber)}
.tr-more{flex:0 0 40px;align-self:stretch;color:var(--line);font-size:15px;border-radius:10px;transition:color .2s,transform .25s var(--ease)}
.tr-more:hover{color:var(--pri);transform:rotate(90deg)}
.stepper em i{font-style:normal;opacity:.55}
.dos-clock{display:flex;align-items:flex-end;gap:1.5px;height:50px;margin-bottom:3px}
.dos-clock i{flex:1;background:var(--pri);border-radius:2px 2px 0 0;min-width:0}
.dos-clock-x{display:flex;justify-content:space-between;font-size:10px;color:var(--dim)}
.dos-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:56px;margin-bottom:4px}
.dos-wd .wd{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.dos-wd .wd i{width:70%;max-width:26px;background:var(--pri);opacity:.8;border-radius:4px 4px 2px 2px}
.dos-wd .wd em{font-style:normal;font-size:10.5px;color:var(--dim)}
.dos-h3{font-size:13px;color:var(--sub);font-weight:600;margin:14px 0 8px}
.dos-chart{margin-bottom:4px}
.di-rate i{font-style:normal;font-size:10px;color:var(--dim);margin-left:2px}
.dossier-item .di-rate+.di-rate{color:var(--pri-deep)}
.dos-ops .btn{min-height:40px}
.dos-note{margin-bottom:8px}
/* SECTION: v5 —— 凭证 / 安全面板 / 课格分组 / 挑战墙 / 月历 */
.proof-drop{display:block;border:1.5px dashed var(--line);border-radius:14px;padding:18px;text-align:center;cursor:pointer;transition:border-color .2s;background:var(--card2)}
.proof-drop:hover{border-color:var(--pri)}
.proof-empty span{font-size:22px;color:var(--pri)}
.proof-empty p{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.6}
.proof-empty i{font-style:normal;font-size:11.5px;color:var(--dim)}
.proof-prev{position:relative}
.proof-prev img{max-width:100%;max-height:260px;border-radius:11px;display:block;margin:0 auto}
.proof-clear{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;font-style:normal;cursor:pointer}
.proof-load{font-size:12.5px;color:var(--dim);margin-top:8px}
.proof-box{text-align:center;margin-bottom:10px}
.proof-box img{max-width:100%;max-height:60vh;border-radius:12px}
.tr-proof{flex:0 0 auto;align-self:center;margin-left:8px}
.tr-proof.has{width:40px;height:40px;border-radius:10px;background:var(--pri-soft);font-size:17px;display:flex;align-items:center;justify-content:center}
.tr-proof.req{font-size:11px;color:var(--amber);border:1px solid var(--amber);border-radius:99px;padding:4px 9px;font-weight:650}
.tr-proof.opt{width:40px;height:40px;border-radius:10px;font-size:15px;opacity:.35;background:transparent}
.tr-proof.opt:hover{opacity:.85}
.sec-status{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.sec-status p{font-size:12.5px;color:var(--sub);font-family:var(--num)}
.bk-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:46vh;overflow-y:auto}
.bk-row{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:10px 13px}
.bk-info{flex:1;min-width:0}
.bk-info strong{font-size:13.5px}
.bk-info p{font-size:11.5px;color:var(--dim);font-family:var(--num)}
.bk-row .btn{min-height:34px;padding:7px 13px;font-size:13px}
.tpl-groups{display:flex;flex-direction:column;gap:14px;max-height:60vh;overflow-y:auto}
.tpl-grp-h{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.12em;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.tpl-grp-h i{font-style:normal;font-family:var(--num);font-size:10px;background:var(--pri-soft);color:var(--pri-deep);border-radius:99px;padding:1px 7px;font-weight:700}
.chal-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}

.chal-cell.hit{border-color:var(--pri);background:var(--pri-soft)}
.chal-cell .cc-ic{font-size:17px}
.chal-cell strong{font-size:12.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chal-cell p{font-size:11px;color:var(--dim);font-family:var(--num);margin-top:auto}
.cal-wrap{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-h{text-align:center;font-size:11px;color:var(--dim);padding-bottom:2px}
.cal-cell{aspect-ratio:1;border-radius:9px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--sub);cursor:default;position:relative;border:1px solid transparent}
.cal-cell.l1{background:var(--hm1);color:#2b5a3c}
.cal-cell.l2{background:var(--hm2);color:#234f33}
.cal-cell.l3{background:var(--hm3);color:#fff}
.cal-cell.l4{background:var(--hm4);color:#fff}
.cal-cell.rest{outline:1.5px dashed var(--dim);outline-offset:-3px}
.cal-cell.fut{opacity:.35}
.cal-cell.dim{background:transparent;color:var(--dim)}
.cal-cell.clickable{cursor:pointer}
.cal-cell.clickable:hover{border-color:var(--pri)}
.cal-cell b{font-family:var(--num);font-size:12.5px;font-weight:700;line-height:1}
.cal-cell em{font-style:normal;font-size:9px;opacity:.8;margin-top:2px}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav strong{font-family:var(--serif);font-size:15px}
.dd-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.dd-item:last-child{border-bottom:0}
.dd-item .ok{color:var(--pri);font-weight:700;width:18px;text-align:center}
.dd-item .no{color:var(--dim);width:18px;text-align:center}
.dd-item em{font-style:normal;font-family:var(--num);font-size:11.5px;color:var(--dim);margin-left:auto}
.dd-item .dd-att{flex:0 0 34px;width:34px;height:34px;border-radius:8px;object-fit:cover;cursor:zoom-in;background:var(--card2)}
.dd-note{font-size:12px;color:var(--sub);width:100%;order:3}
/* v5: 雷达 + 凭证墙 */
.radar-wrap{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:center}
.radar{width:220px;height:220px}
@media (max-width:767px){.radar-wrap{grid-template-columns:1fr}.radar{margin:0 auto}}
.proof-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
.pw-cell{cursor:pointer;text-align:center}
.pw-cell img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:11px;background:var(--card2);display:block;transition:transform .2s var(--ease)}
.pw-cell:hover img{transform:scale(1.04)}
.pw-cell span{font-size:11px;color:var(--dim);display:block;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-cell.clickable{cursor:pointer}
.hm-cell.clickable:hover{outline:2px solid var(--pri);outline-offset:1px}
